/* ─── COUNT-UP HOOK (replaces useInView + animate from Framer Motion) ── */

function useCountUp(target, deps) {
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      observer.disconnect();
      let startTs = null;
      const duration = 1500;
      function step(ts) {
        if (!startTs) startTs = ts;
        const progress = Math.min((ts - startTs) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setDisplay(Math.round(eased * target));
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, { rootMargin: '-40px' });
    observer.observe(el);
    return () => observer.disconnect();
  }, deps || [target]);
  return [display, ref];
}

function AnimatedScore({ target, leading }) {
  const [display, ref] = useCountUp(target, [target]);

  return (
    <span
      ref={ref}
      className={`font-bold text-sm sm:text-base tabular-nums transition-colors ${leading ? 'text-orange' : 'text-gray-300'}`}
    >
      {display}
    </span>
  );
}

            const oppScore = game.isHome ? game.awayScore : game.homeScore;

            const fldLeads = fldScore > oppScore;
            const isFinal  = game.status === 'Final';
            return (
              <div key={i} className="px-4 sm:px-5 py-1.5 text-white flex items-center gap-2.5">
                <div>
                  {/* Sport label + live badge */}

                  </div>
                  {/* Score line */}

                    <span className="text-gray-500 text-xs">FLD</span>
                    <AnimatedScore target={fldScore} leading={fldLeads}  />
                    <span className="text-gray-600 text-xs">–</span>
                    <AnimatedScore target={oppScore} leading={!fldLeads} />
                    <span className="text-gray-500 text-xs">{oppName.split(' ')[0]}</span>

                <span

              <div className="text-center">
                <div className="font-serif text-2xl font-black leading-none">HM</div>
                <div className="text-xs text-gray-500 mt-1 tracking-wide">Horace Mann</div>
              </div>
            </div>

            <div className="border-t border-white/10 pt-4 space-y-2 text-sm">
              {[
                ['Time',     '6:00 PM'],
                ['Location', 'Fieldston Gymnasium'],
                ['Date',     'Wednesday, Apr 16'],
              ].map(([label, val]) => (
                <div key={label} className="flex justify-between items-center">

/* ─── TEAMS ─────────────────────────────────────────────── */

const SPORT_ICONS = {
  Football: '🏈', Soccer: '⚽', Volleyball: '🏐', 'Field Hockey': '🏑',
  'Cross Country': '🏃', Basketball: '🏀', Swimming: '🏊', Wrestling: '🤼',
  Squash: '🎾', Fencing: '🤺', 'Indoor Track': '🏃', Baseball: '⚾',
  Softball: '🥎', Lacrosse: '🥍', Tennis: '🎾', 'Outdoor Track': '🏃', Golf: '⛳',
};

const SEASON_COLORS = {
  Fall:   { bg: 'bg-amber-900/10',   border: 'border-amber-700/30',   badge: 'bg-amber-800/80 text-amber-100',    dot: 'bg-amber-500'    },
  Winter: { bg: 'bg-blue-900/10',    border: 'border-blue-700/30',    badge: 'bg-blue-800/80 text-blue-100',      dot: 'bg-blue-400'     },
  Spring: { bg: 'bg-emerald-900/10', border: 'border-emerald-700/30', badge: 'bg-emerald-800/80 text-emerald-100',dot: 'bg-emerald-400'  },
};

function TeamCard({ team, season }) {
  const colors     = SEASON_COLORS[season];
  const isChampion = !!team.champion;

  return (
    <div
      className={`team-card ${isChampion ? 'team-card-champ' : ''} rounded-xl border ${colors.border} ${colors.bg} p-4 relative overflow-hidden cursor-default select-none`}
    >
      {isChampion && (
        <div className="absolute top-0 right-0 bg-orange text-white text-xs font-bold px-2 py-0.5 rounded-bl-lg" style={{ letterSpacing: '0.04em' }}>
          ★ CHAMP
        </div>
      )}
      <div className="flex items-start justify-between mb-2.5">
        <span className="text-xl">{SPORT_ICONS[team.name] || '🏅'}</span>
        <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${colors.badge}`}>{team.gender}</span>
      </div>
      <div className="font-serif font-bold text-navy text-sm leading-tight mb-0.5">
        {team.gender === 'Boys/Girls' ? '' : team.gender + ' '}{team.name}
      </div>
      <div className="text-xs text-gray-400 mb-2 leading-snug">{team.coach}</div>
      <div className={`font-bold text-sm ${isChampion ? 'text-orange' : 'text-navy'}`}>{team.record}</div>
      {isChampion && <div className="mt-1 text-xs text-orange font-semibold leading-snug">{team.champion}</div>}
    </div>
  );
}

function TeamsSection() {
  const [activeSeason, setActiveSeason] = useState('All');
  const seasons = ['All', 'Fall', 'Winter', 'Spring'];

  return (
    <section id="teams" className="py-14 sm:py-16 max-w-7xl mx-auto px-4 sm:px-6">
      {/* Header */}
      <div className="mb-10">
        <div className="flex items-center gap-2 mb-2">
          <span className="w-6 h-px bg-orange inline-block" />
          <span className="text-orange text-xs font-semibold uppercase" style={{ letterSpacing: '0.15em' }}>Programs</span>
        </div>
        <h2 className="font-serif text-3xl sm:text-4xl font-bold text-navy mb-5" style={{ lineHeight: '1.1' }}>
          Varsity Teams
        </h2>
        {/* Filter pills */}
        <div className="flex flex-wrap gap-2">
          {seasons.map(s => (
            <button
              key={s}
              onClick={() => setActiveSeason(s)}
              className={`px-4 py-1.5 text-sm font-semibold rounded-full border transition-colors duration-150 ${
                activeSeason === s
                  ? 'bg-navy text-white border-navy shadow-sm'
                  : 'bg-white text-navy border-gray-300 hover:border-navy'
              }`}
              style={{ cursor: 'pointer' }}
            >
              {s}
            </button>
          ))}
        </div>
      </div>

      {/* Season grids */}
      {(activeSeason === 'All' ? ['Fall', 'Winter', 'Spring'] : [activeSeason]).map(season => (
        <div key={season} className="mb-12">
          <div className="flex items-center gap-3 mb-5">
            <span className={`w-2.5 h-2.5 rounded-full ${SEASON_COLORS[season].dot}`} />
            <h3 className="font-serif text-xl sm:text-2xl font-bold text-navy">{season} Sports</h3>
            <div className="flex-1 h-px bg-gray-200 ml-1" />
            <span className="text-xs text-gray-400 tabular-nums">{SEASONS[season].length} programs</span>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
            {SEASONS[season].map((team, i) => (
              <TeamCard key={`${season}-${i}`} team={team} season={season} index={i} />
            ))}
          </div>
        </div>
      ))}
    </section>
  );
}

          {SCHEDULE.map((game, i) => {

                  isToday

              >
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4">

                        {isToday && (
                          <span className="bg-orange text-white text-xs font-bold px-2 py-0.5 rounded-sm tracking-wider uppercase">
                            Today

                        <span className="text-gray-500 text-xs font-medium uppercase tracking-wider">{game.context}</span>
                      </div>
                      <div className="font-serif text-base sm:text-lg font-bold text-white leading-snug truncate">

                </div>
              </div>
            );
          })}
        </div>
      </div>

          <div className="relative flex flex-col sm:flex-row items-start sm:items-center gap-5 sm:gap-8">
            <div className="flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 bg-orange rounded-full flex items-center justify-center">
              <span className="text-3xl sm:text-4xl">🏆</span>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-orange text-xs font-bold uppercase mb-1.5" style={{ letterSpacing: '0.14em' }}>

      </div>

/* ─── STATS BAR ─────────────────────────────────────────── */

function StatNumber({ stat, index }) {
  const [display, ref] = useCountUp(stat.value, [stat.value, index]);

  return (
    <div ref={ref} className="text-center">
      <div className="font-serif text-3xl sm:text-4xl font-black text-white leading-none">
        {display}{stat.suffix || ''}
      </div>
      <div className="text-white/70 text-xs sm:text-sm font-medium mt-2 leading-snug">{stat.label}</div>
    </div>
  );
}

function StatsBar() {
  const stats = [
    { label: 'Varsity Programs',         value: 22,  suffix: ''   },
    { label: 'Student Athletes',          value: 400, suffix: '+'  },
    { label: 'League Titles Since 2000',  value: 65,  suffix: ''   },
    { label: 'Years of Athletics',        value: 80,  suffix: '+'  },
  ];
  return (
    <div className="bg-orange">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-12">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-8">
          {stats.map((s, i) => <StatNumber key={i} stat={s} index={i} />)}
        </div>
      </div>
    </div>
  );
}
